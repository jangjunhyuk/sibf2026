<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>2026 서울국제도서전 부스 배치도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  /* depth — near-black immersive dark */
  --bg:#121212;        /* Level 0 page background */
  --surface:#181818;   /* Level 1 cards / sidebar */
  --surface2:#1f1f1f;  /* interactive surfaces, inputs */
  --card:#252525;      /* elevated card */
  --card2:#2a2a2a;     /* chips, badges */
  /* text */
  --text:#ffffff;
  --text2:#b3b3b3;     /* silver — secondary */
  --text3:#7c7c7c;     /* dim — muted */
  --border:#4d4d4d;
  /* brand — functional only */
  --green:#1ed760;
  --green2:#1db954;
  /* semantic */
  --neg:#f3727f; --warn:#ffa42b; --info:#539df5;
  /* floor-plan category content colours */
  --cat-ex:#a7a7a7;   /* 전시 */
  --cat-lec:#efc22a;  /* 강연·홀 */
  --cat-vil:#52bee6;  /* 책마을 */
  --cat-evt:#f47a20;  /* 이벤트 */
  --cat-cafe:#9486c4; /* 카페 */
  /* elevation */
  --sh-card:rgba(0,0,0,.3) 0px 8px 8px;
  --sh-dialog:rgba(0,0,0,.5) 0px 8px 24px;
  --font:"Pretendard","Helvetica Neue",helvetica,arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:#000;
  color:var(--text);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}

#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.7);}

/* ---------- header ---------- */
header{padding:16px 16px 0;background:var(--bg);position:relative;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:13px;height:13px;border-radius:50%;background:var(--green);flex:0 0 auto;box-shadow:0 0 12px rgba(30,215,96,.5);}
.brand .kr{font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.4px;color:var(--text);}
.brand .yr{font-weight:700;font-size:13px;color:var(--green);letter-spacing:.5px;margin-left:2px;}
.brand .sub{font-size:10px;color:var(--text2);letter-spacing:2px;margin-top:4px;text-transform:uppercase;font-weight:600;}

/* segmented toggle — Spotify selected-pill */
.seg{display:flex;margin-top:16px;background:var(--surface2);border-radius:9999px;padding:4px;position:relative;}
.seg button{flex:1;padding:9px 0;font-size:13px;font-weight:700;color:var(--text2);border-radius:9999px;position:relative;z-index:2;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.3px;}
.seg button.on{color:#000;}
.seg .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--text);border-radius:9999px;z-index:1;transition:transform .28s cubic-bezier(.4,1.1,.4,1);box-shadow:0 2px 8px rgba(0,0,0,.4);}
.seg.map .pill{transform:translateX(100%);}
.seg svg{width:15px;height:15px;}

/* search — pill input, inset border */
.searchwrap{padding:14px 16px 10px;}
.search{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:9999px;padding:0 18px;height:48px;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s;}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--text);}
.search svg{width:18px;height:18px;color:var(--text2);flex:0 0 auto;}
.search input{flex:1;border:none;background:none;outline:none;font-size:16px;color:var(--text);min-width:0;font-weight:500;}
.search input::placeholder{color:var(--text2);}
.search input[type=search]::-webkit-search-cancel-button,
.search input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none;}
.search .clr{font-size:18px;color:var(--text2);width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;}
.search.has .clr{display:flex;}
.search .clr:active{background:var(--card2);}

/* filter chips — pills */
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;font-size:12px;font-weight:700;padding:8px 14px;border-radius:9999px;background:var(--card2);color:var(--text);white-space:nowrap;transition:background .18s,color .18s,transform .1s;display:flex;align-items:center;gap:6px;letter-spacing:.2px;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--text);color:#000;}
.chip .star{font-size:12px;color:var(--green);}
.chip.on .star{color:var(--green2);}
.countsum{font-size:11px;color:var(--text2);padding:0 16px 8px;letter-spacing:.3px;font-weight:600;}

/* ---------- list ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#listView{padding:0 0 28px;}
.grouphd{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 72%,rgba(18,18,18,0));padding:16px 16px 8px;font-weight:700;font-size:13px;color:var(--text);display:flex;align-items:baseline;gap:8px;text-transform:uppercase;letter-spacing:1.6px;}
.grouphd .n{font-size:11px;color:var(--text2);font-weight:700;letter-spacing:.5px;}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.05);transition:background .15s;}
.row:active{background:var(--surface2);}
.row .info{flex:1;min-width:0;}
.row .nm{font-size:16px;font-weight:700;line-height:1.25;color:var(--text);}
.row .nm mark{background:rgba(30,215,96,.32);color:var(--text);border-radius:3px;padding:0 1px;}
.row .meta{font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.3;font-weight:500;}
.row .en{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%;}
.flag{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--text2);background:var(--card2);padding:2px 8px;border-radius:9999px;text-transform:uppercase;}
.booth{font-size:11px;font-weight:700;color:var(--text);background:var(--surface2);padding:6px 11px;border-radius:9999px;flex:0 0 auto;letter-spacing:.4px;}
.booth:active{background:var(--card2);}
.star-btn{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:19px;color:var(--text2);transition:transform .15s,color .15s;}
.star-btn.on{color:var(--green);}
.star-btn:active{transform:scale(1.25);}

.empty{text-align:center;padding:72px 30px;color:var(--text2);}
.empty .big{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
.empty .sm{font-size:13px;line-height:1.6;}

/* ---------- map ---------- */
#mapView{flex:1;display:none;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);}
#mapView.show{display:flex;}
#listScroll.hide{display:none;}
.mapstage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--bg);}
.mapstage:active{cursor:grabbing;}
.mapcanvas{position:absolute;top:0;left:0;width:720px;transform-origin:0 0;will-change:transform;}
.hall{margin:0;padding:16px;}
.hall-title{font-weight:700;font-size:22px;color:var(--text);margin:6px 2px 14px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:1.5px;}
.hall-title .dot{width:6px;height:22px;background:var(--green);border-radius:9999px;box-shadow:0 0 10px rgba(30,215,96,.5);}
.fp-row{display:flex;gap:10px;margin-bottom:10px;align-items:stretch;}
.blk{background:var(--surface);border-radius:8px;padding:9px;flex:1;min-width:0;box-shadow:var(--sh-card);}
.blk-hd{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:4px;letter-spacing:.3px;}
.blk-hd .cnt{font-size:9px;color:var(--text2);background:var(--card2);border-radius:9999px;padding:2px 7px;font-weight:700;}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;}
.cell{aspect-ratio:1.15;border-radius:6px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;position:relative;transition:transform .12s,box-shadow .12s,background .15s;}
.cell:active{transform:scale(.92);}
.cell .id{font-size:10px;font-weight:700;color:var(--text);line-height:1;letter-spacing:.2px;}
.cell .nm{font-size:7.5px;color:var(--text2);line-height:1.05;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.cell .fstar{position:absolute;top:1px;right:2px;font-size:8px;color:var(--green);}
.cell.multi::after{content:attr(data-c);position:absolute;bottom:1px;left:3px;font-size:7px;color:var(--text3);font-weight:700;}
.cell.hit{background:rgba(30,215,96,.16);box-shadow:0 0 0 2px var(--green);z-index:2;}
.cell.hit .id{color:var(--green);}
.cell.sel{background:var(--green)!important;box-shadow:0 0 0 3px rgba(30,215,96,.3)!important;z-index:3;}
.cell.sel .id,.cell.sel .nm,.cell.sel.multi::after{color:#000!important;}
.cell.sel .fstar{color:#000;}
/* category fills (content colour, tuned for dark) */
.cell.cat-vil{background:rgba(82,190,230,.16);box-shadow:inset 0 0 0 1px rgba(82,190,230,.45);}
.cell.cat-vil .id{color:var(--cat-vil);}
.cell.cat-lec{background:rgba(239,194,42,.16);box-shadow:inset 0 0 0 1px rgba(239,194,42,.45);}
.cell.cat-lec .id{color:var(--cat-lec);}
.cell.cat-cafe{background:rgba(148,134,196,.18);box-shadow:inset 0 0 0 1px rgba(148,134,196,.45);}
.cell.cat-cafe .id{color:var(--cat-cafe);}
.cell.cat-ex{background:rgba(167,167,167,.14);box-shadow:inset 0 0 0 1px rgba(167,167,167,.4);}
.cell.cat-evt{background:rgba(244,122,32,.16);box-shadow:inset 0 0 0 1px rgba(244,122,32,.45);}
.blk.village{flex:1.4;}
.blk.village .cells{grid-template-columns:1fr;}
.blk.village .cell{aspect-ratio:auto;min-height:96px;}
.blk.single{flex:.85;}
.blk.single .cells{grid-template-columns:1fr;}
.blk.single .cell{aspect-ratio:auto;min-height:56px;}
.blk.info{flex:.5;}
.blk.info .cell{aspect-ratio:auto;min-height:44px;}
.blk-hd .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}

/* gates / entrances — neutral surface, green wayfinding arrow */
.gate{font-size:10px;color:var(--text2);text-align:center;border-radius:8px;padding:8px 6px;background:var(--surface2);font-weight:700;letter-spacing:.4px;display:flex;align-items:center;justify-content:center;gap:6px;}
.gate .arr{color:var(--green);font-size:13px;}
.fp-split{display:flex;gap:10px;align-items:stretch;margin-bottom:10px;}
.fp-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.fp-main>.fp-row{margin-bottom:10px;}
.fp-main>.fp-row:last-child{margin-bottom:0;}
.fp-gate-v{flex:0 0 62px;border-radius:8px;background:rgba(30,215,96,.08);box-shadow:inset 0 0 0 1px rgba(30,215,96,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--text);letter-spacing:.3px;line-height:1.35;padding:10px 4px;}
.fp-gate-v .en{display:block;font-size:8px;font-weight:600;color:var(--text2);margin-top:2px;letter-spacing:.2px;}
.fp-gate-v .arr{font-size:16px;color:var(--green);margin-top:4px;}
.fp-spacer{flex:1;}
.gate-exit,.gate-enter{flex:2;background:rgba(30,215,96,.08);box-shadow:inset 0 0 0 1px rgba(30,215,96,.35);color:var(--text);}

/* map controls — circular */
.mapctl{position:absolute;right:14px;bottom:calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:9px;z-index:20;}
.mapctl button{width:44px;height:44px;border-radius:50%;background:var(--surface2);box-shadow:var(--sh-dialog);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:var(--text);}
.mapctl button:active{background:var(--card);}
.mapctl .reset{font-size:15px;}

/* legend — dark card */
.legend{position:absolute;left:14px;bottom:calc(16px + var(--safe-b));z-index:20;background:var(--surface);border-radius:10px;box-shadow:var(--sh-dialog);padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-width:140px;}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text2);font-weight:500;}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
.legend.collapsed .lg{display:none;}
.legend .lhd{font-size:10px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-transform:uppercase;letter-spacing:1px;gap:8px;}

/* map search hint — pill */
.maphint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:18;font-size:11px;color:var(--text);background:var(--surface);border-radius:9999px;padding:7px 15px;box-shadow:var(--sh-dialog);font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;letter-spacing:.3px;}
.maphint.show{opacity:1;}

/* ---------- bottom sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px);}
.sheet-bg.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--sh-dialog);transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1,.4,1);max-height:78dvh;display:flex;flex-direction:column;padding-bottom:var(--safe-b);}
.sheet.show{transform:translateY(0);}
.sheet .grab{width:38px;height:4px;background:var(--border);border-radius:9999px;margin:10px auto 4px;flex:0 0 auto;}
.sheet-hd{padding:8px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px;flex:0 0 auto;}
.sheet-hd .bcode{font-weight:700;font-size:15px;color:#000;background:var(--green);padding:9px 14px;border-radius:9999px;letter-spacing:.4px;flex:0 0 auto;}
.sheet-hd .bttl{flex:1;min-width:0;}
.sheet-hd .bttl .t{font-weight:700;font-size:18px;line-height:1.2;color:var(--text);}
.sheet-hd .bttl .s{font-size:12px;color:var(--text2);margin-top:3px;font-weight:500;}
.sheet-hd .close{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text2);flex:0 0 auto;}
.sheet-hd .close:active{background:var(--card);}
.sheet-act{padding:12px 20px 6px;flex:0 0 auto;}
.sheet.from-map .sheet-act{display:none;}
.locate-btn{width:100%;height:44px;border-radius:9999px;background:var(--green);color:#000;font-size:14px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(30,215,96,.25);transition:transform .12s,background .15s;}
.locate-btn svg{width:17px;height:17px;}
.locate-btn:active{transform:scale(.98);background:var(--green2);}
/* zone mini-map inside map-context modal */
.zone{padding:14px 20px 4px;}
.zhd{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.zhd b{text-transform:none;letter-spacing:0;color:var(--text);font-size:12.5px;font-weight:700;}
.zmap{display:flex;flex-direction:column;gap:5px;background:var(--bg);border-radius:10px;padding:9px;}
.zrow{display:flex;gap:5px;}
.ztile{flex:1;min-width:0;height:27px;border-radius:5px;background:var(--card2);color:var(--text2);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;letter-spacing:.2px;}
.ztile.me{background:var(--green);color:#000;box-shadow:0 0 0 2px rgba(30,215,96,.35);}
.zcap{font-size:9px;color:var(--text3);text-align:center;margin-top:7px;letter-spacing:.3px;font-weight:600;}
.zcap .arr{color:var(--green);}
.zstrip-hd{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;display:flex;align-items:center;gap:7px;}
.zstrip-hd .zhint{text-transform:none;letter-spacing:.2px;font-size:9px;color:#000;background:var(--green);padding:2px 7px;border-radius:9999px;}
.zgrid{display:grid;gap:6px;}
.zb-empty{visibility:hidden;}
.zstrip{display:flex;flex-wrap:wrap;gap:6px;}
.zb{font-size:11px;font-weight:700;padding:7px 4px;border-radius:9px;background:var(--surface2);color:var(--text);letter-spacing:.2px;transition:transform .1s;text-align:center;min-width:0;}
.zstrip .zb{border-radius:9999px;padding:7px 11px;}
.zb.sel{background:var(--green);color:#000;}
.zb:active{transform:scale(.95);}
.zone-div{height:1px;background:rgba(255,255,255,.07);margin:14px 20px 0;}
.sheet-body{overflow-y:auto;padding:6px 0 16px;}
.srow{display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.05);}
.srow:last-child{border-bottom:none;}
.srow .info{flex:1;min-width:0;}
.srow .nm{font-size:15px;font-weight:700;line-height:1.25;color:var(--text);}
.srow .en{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.3;word-break:break-word;font-weight:500;}
.srow .star-btn{font-size:21px;}

@media (max-width:380px){
  .cells{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));}
  .brand .kr{font-size:20px;}
}
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <div>
        <div class="kr">서울국제도서전 <span class="yr">2026</span></div>
        <div class="sub">Seoul Int'l Book Fair · 부스 배치도</div>
      </div>
    </div>
    <div class="seg" id="seg">
      <span class="pill"></span>
      <button data-view="list" class="on" id="segList">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke-linecap="round"/></svg>목록
      </button>
      <button data-view="map" id="segMap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Zm0 0v15m6-12v15" stroke-linejoin="round" stroke-linecap="round"/></svg>지도
      </button>
    </div>
    <div class="searchwrap">
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="출판사 · 부스번호 · 국가 검색" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="searchClear" aria-label="지우기">×</button>
      </div>
    </div>
  </header>

  <!-- LIST -->
  <div class="chips" id="chips"></div>
  <div class="countsum" id="countSum"></div>
  <div class="scroll" id="listScroll">
    <div id="listView"></div>
  </div>

  <!-- MAP -->
  <div id="mapView">
    <div class="maphint" id="mapHint"></div>
    <div class="mapstage" id="mapStage">
      <div class="mapcanvas" id="mapCanvas"></div>
    </div>
    <div class="legend" id="legend">
      <div class="lhd" id="legendHd"><span>범례 Legend</span><span class="tg" id="legendTg">▾</span></div>
      <div class="lg"><span class="sw" style="background:var(--cat-vil)"></span>책마을 Book Village</div>
      <div class="lg"><span class="sw" style="background:var(--cat-lec)"></span>강연·홀 Lecture</div>

/* favorites storage (localStorage w/ in-memory fallback for sandboxed iframes) */
const FavStore=(()=>{
  let mem={}; let ok=false;
  try{ const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); ok=true; }catch(e){ ok=false; }
  const KEY="sibf2026_favs";
  function read(){ if(ok){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } } return mem; }
  function write(o){ if(ok){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} } else { mem=o; } }
  return {read,write};
})();
let favs=FavStore.read(); // {no:true}
function isFav(no){ return !!favs[no]; }
function toggleFav(no){ if(favs[no]) delete favs[no]; else favs[no]=1; FavStore.write(favs); }
function favCount(){ return Object.keys(favs).length; }

function flagOf(e){ return CFLAG[e.country]||e.country; }
function isIntl(e){ return e.country!=="대한민국"; }

/* ============ block layout (mirrors PDF floor plan) ============ */
function blockOf(booth){
  if(booth.indexOf("Ticket")===0) return booth;
  const m=booth.match(/^([A-Z])(\d+)(\d\d)$/);
  if(!m) return booth;
  return m[1]+m[2];
}
function blockLabel(blk){
  if(INFO_BLOCKS[blk]) return blk.indexOf("_A")>0?"A홀 인포":"B1홀 인포";
  if(byBooth[blk]){ const lead=byBooth[blk][0]; return (lead.name||blk); } // exact special booth → its name
  const m=blk.match(/^([A-Z])(\d+)$/);
  return m? m[1]+m[2]+"00" : blk;
}
/* category per booth (special facilities) */
function catOf(e){
  const b=e.booth;
  if(b.indexOf("Ticket")===0) return "info";          // 인포데스크
  if(b==="B400") return "vil";                         // 책마을
  if(b==="B701") return "cafe";                        // 커피 리브레
  if(b==="B702"||b==="B703") return "ex";              // 라운지/주제전시
  if(/Readers Hall|책만남홀/.test(e.name)||b==="B704") return "lec";
  if(e.sp) return "lec";
  return "";
}
/* macro layout: ordered rows of block-codes per hall.
   Entries can be a block prefix (e.g. "A12") OR an exact booth id (e.g. "B701"). */

/* booths that belong to each pseudo-block */
function boothsInBlock(blk){
  if(blk==="B7extra") return ["B705","B706","B707"];
  if(byBooth[blk]) return [blk];                       // exact single booth (B400/B701..)
  return Object.keys(byBooth).filter(b=>blockOf(b)===blk).sort(sortBooth);
}
const INFO_BLOCKS={};
const SINGLE_BLOCKS={"B400":1,"B701":1,"B702":1,"B703":1,"B704":1};
function sortBooth(a,b){
  const pa=a.match(/(\d+)/g),pb=b.match(/(\d+)/g);
  if(pa&&pb){ const na=+pa.join(""),nb=+pb.join(""); if(na!==nb) return na-nb; }
  return a<b?-1:1;
}

let view="list";

/* ============ LIST render ============ */
const listView=document.getElementById("listView");
const countSum=document.getElementById("countSum");

function matchQuery(e){ return !query || e.searchKey.indexOf(query)>=0; }
function passFilter(e){
  if(filter==="fav") return isFav(e.no);
  if(filter==="intl") return isIntl(e);
  return true;
}
function hl(text){
  if(!query||!text) return escapeHtml(text);
  const i=text.toLowerCase().indexOf(query);
  if(i<0) return escapeHtml(text);
  return escapeHtml(text.slice(0,i))+"<mark>"+escapeHtml(text.slice(i,i+query.length))+"</mark>"+escapeHtml(text.slice(i+query.length));
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderList(){
  const items=EX.filter(e=>matchQuery(e)&&passFilter(e));
  // group by hall (A / B1) then sort by booth
  const groups={A:[],B:[]};
  items.forEach(e=>{ (e.booth[0]==="B"?groups.B:groups.A).push(e); });
  let html="";
  const order=[["A","Hall A"],["B","Hall B1"]];
  let shown=0;
  order.forEach(([k,label])=>{
    const arr=groups[k].sort((x,y)=>sortBooth(x.booth,y.booth)||x.no-y.no);
    if(!arr.length) return;
    shown+=arr.length;
    html+=`<div class="grouphd">${label}<span class="n">${arr.length}</span></div>`;
    arr.forEach(e=>{
      const fav=isFav(e.no);
      const enLine=(e.ko&&e.en&&e.ko!==e.en)?`<span class="en">${hl(e.en)}</span>`:"";
      const intl=isIntl(e)?`<span class="flag">${flagOf(e)}</span>`:"";
      html+=`<div class="row" data-booth="${e.booth}">
        <div class="info">
          <div class="nm">${hl(e.name)}</div>
          <div class="meta">${intl}${enLine}</div>
        </div>
        <button class="booth" data-locate="${e.booth}">${e.booth.replace("Ticket-Info_","INFO ")}</button>
        <button class="star-btn ${fav?"on":""}" data-fav="${e.no}" aria-label="즐겨찾기">${fav?"★":"☆"}</button>
      </div>`;
    });
  });
  if(!shown){
    const msg=filter==="fav"?["즐겨찾기가 비어 있어요","별표를 눌러 관심 부스를 저장하세요"]:["검색 결과가 없습니다","다른 이름이나 부스번호로 검색해 보세요"];
    html=`<div class="empty"><div class="big">${msg[0]}</div><div class="sm">${msg[1]}</div></div>`;
  }
  listView.innerHTML=html;
  countSum.textContent=shown?`${shown}개 참가사 표시 중 · 총 ${EX.length}개`:"";
}

function resetListScroll(){

  sc.style.overflowY="hidden";
  sc.scrollTop=0;
  requestAnimationFrame(()=>{ sc.style.overflowY=""; });
}
chipsEl.addEventListener("click",e=>{

  filter=b.dataset.f; renderChips(); renderList(); resetListScroll();
});

listView.addEventListener("click",e=>{
  const fb=e.target.closest("[data-fav]");
  if(fb){ toggleFav(+fb.dataset.fav); renderChips(); renderList(); paintCells(); return; }
  const loc=e.target.closest("[data-locate]");
  if(loc){ goToBoothOnMap(loc.dataset.locate); return; }
  const row=e.target.closest(".row");
  if(row&&row.dataset.booth){ openSheet(row.dataset.booth); }
});

/* ============ MAP render ============ */
const mapCanvas=document.getElementById("mapCanvas");
function cellHtml(booth){
  const list=byBooth[booth]||[];
  const lead=list[0];
  const cat=lead?catOf(lead):"";
  const hasFav=list.some(x=>isFav(x.no));
  const nm=lead?(lead.name||booth):booth;
  const cls=["cell"];
  if(cat) cls.push("cat-"+cat);
  if(list.length>1) cls.push("multi");
  return `<div class="${cls.join(" ")}" data-booth="${booth}" data-c="${list.length}">
    ${hasFav?'<span class="fstar">★</span>':''}
    <span class="id">${booth.indexOf("Ticket")===0?"i":booth}</span>
    <span class="nm">${escapeHtml(nm)}</span>
  </div>`;
}
function blockHtml(blk){
  const booths=boothsInBlock(blk);
  if(!booths.length) return "";
  const isVil=blk==="B400";
  const isInfo=!!INFO_BLOCKS[blk];
  const isSingle=!!SINGLE_BLOCKS[blk]&&!isVil;
  const cls=["blk"];
  if(isVil) cls.push("village");
  if(isInfo) cls.push("info");
  if(isSingle) cls.push("single");
  const cnt=isVil?booths.reduce((s,b)=>s+(byBooth[b]||[]).length,0):booths.length;
  const cntTag=(isInfo||isSingle)?"":`<span class="cnt">${cnt}</span>`;
  return `<div class="${cls.join(" ")}">
    <div class="blk-hd"><span class="lbl">${escapeHtml(blockLabel(blk))}</span>${cntTag}</div>
    <div class="cells">${booths.map(cellHtml).join("")}</div>
  </div>`;
}
function rowHtml(codes){
  const cells=codes.map(blockHtml).filter(Boolean).join("");
  return cells?`<div class="fp-row">${cells}</div>`:"";
}
function buildMap(){
  let h="";
  // ---- Hall B1 ----
  h+=`<div class="hall"><div class="hall-title"><span class="dot"></span>Hall B1</div>`;
  h+=`<div class="fp-split">`;
  h+=`<div class="fp-main">`;
  HALL_B_TOP.forEach(r=>h+=rowHtml(r));
  h+=`</div>`;
  // B1홀 출입구 — 우측, B700·B600 행에 걸쳐 세로로 배치
  h+=`<div class="fp-gate-v">B1홀<br>출입구<span class="en">Hall B1<br>Entrance & Exit</span><span class="arr">▶</span></div>`;
  h+=`</div>`;
  h+=rowHtml(HALL_B_BOTTOM);
  h+=`</div>`;
  // ---- Hall A ----
  h+=`<div class="hall"><div class="hall-title"><span class="dot"></span>Hall A</div>`;
  HALL_A.forEach(r=>h+=rowHtml(r));
  // A홀 출입구 — 하단, A500·A600 아래(우측)
  // A홀 출구(A200·A300 아래) / A홀 입구(A500·A600 아래)
  h+=`<div class="fp-row">`
    +`<div class="fp-spacer"></div>`
    +`<div class="gate gate-exit"><span class="arr">▼</span> A홀 출구 · Exit</div>`
    +`<div class="fp-spacer"></div>`
    +`<div class="gate gate-enter">A홀 입구 · Entrance <span class="arr">▲</span></div>`
    +`</div>`;
  h+=`</div>`;
  mapCanvas.innerHTML=h;
}
function paintCells(){
  document.querySelectorAll(".cell").forEach(c=>{
    const list=byBooth[c.dataset.booth]||[];
    const f=list.some(x=>isFav(x.no));
    let s=c.querySelector(".fstar");
    if(f&&!s){ s=document.createElement("span"); s.className="fstar"; s.textContent="★"; c.prepend(s); }
    if(!f&&s){ s.remove(); }
  });
}
function applyMapSearch(){
  let firstHit=null;
  document.querySelectorAll(".cell").forEach(c=>{
    const list=byBooth[c.dataset.booth]||[];
    const hit= query && list.some(e=>e.searchKey.indexOf(query)>=0);
    c.classList.toggle("hit",!!hit);
    if(hit&&!firstHit) firstHit=c;
  });
  return firstHit;
}

/* ============ pan / zoom ============ */
const stage=document.getElementById("mapStage");
let scale=1,tx=0,ty=0,baseScale=1;
function applyTransform(){ mapCanvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function fitMap(){
  const cw=mapCanvas.scrollWidth||mapCanvas.offsetWidth;
  const ch=mapCanvas.scrollHeight||mapCanvas.offsetHeight;
  const sw=stage.clientWidth, sh=stage.clientHeight;
  if(!cw||!ch) return;
  baseScale=Math.min(sw/cw, 1); // fit width, don't upscale
  scale=baseScale;
  tx=(sw-cw*scale)/2; if(tx<0) tx=0;
  ty=12;
  applyTransform();
}
function clamp(){
  const cw=mapCanvas.offsetWidth*scale, ch=mapCanvas.offsetHeight*scale;
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const minx=Math.min(0,sw-cw-20), maxx= cw<sw? (sw-cw)/2 : 20;
  const miny=Math.min(0,sh-ch-20), maxy= ch<sh? (sh-ch)/2 : 20;
  tx=Math.max(minx,Math.min(maxx,tx));
  ty=Math.max(miny,Math.min(maxy,ty));
}
function zoomBy(f,cx,cy){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  cx=cx??sw/2; cy=cy??sh/2;
  const ns=Math.max(baseScale*0.9,Math.min(4,scale*f));
  const k=ns/scale;
  tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns;
  clamp(); applyTransform();
}
document.getElementById("zoomIn").onclick=()=>zoomBy(1.4);
document.getElementById("zoomOut").onclick=()=>zoomBy(1/1.4);
document.getElementById("zoomReset").onclick=()=>{ fitMap(); };

/* pointer pan + pinch */
let pts=new Map(),lastDist=0,lastMid=null,moved=false,downT=0,downEl=null;
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false; downT=Date.now();
  // setPointerCapture가 이후 이벤트의 target을 stage로 고정하므로,
  // 탭한 셀은 pointerdown 시점의 실제 target에서 미리 잡아 둔다.
  downEl=e.target;
  if(pts.size===2){ const a=[...pts.values()]; lastDist=dist(a[0],a[1]); lastMid=mid(a[0],a[1]); }
});
stage.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    tx+=dx; ty+=dy; clamp(); applyTransform();
  } else if(pts.size===2){
    moved=true;
    const a=[...pts.values()]; const d=dist(a[0],a[1]), m=mid(a[0],a[1]);
    const r=stage.getBoundingClientRect();
    if(lastDist){ const f=d/lastDist; const cx=m.x-r.left, cy=m.y-r.top;
      const ns=Math.max(baseScale*0.9,Math.min(4,scale*f)); const k=ns/scale;
      tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns; clamp(); applyTransform();
    }
    lastDist=d; lastMid=m;
  }
});
function endPt(e){ pts.delete(e.pointerId); if(pts.size<2) lastDist=0; }
stage.addEventListener("pointerup",e=>{
  const quick=Date.now()-downT<400;
  endPt(e);
  if(!moved&&quick){
    let c=(downEl&&downEl.closest)?downEl.closest(".cell"):null;
    if(!c){ const el=document.elementFromPoint(e.clientX,e.clientY); c=(el&&el.closest)?el.closest(".cell"):null; }
    if(c) openSheet(c.dataset.booth);
  }
  downEl=null;
});
stage.addEventListener("pointercancel",endPt);
stage.addEventListener("wheel",e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomBy(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function mid(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }

/* locate a booth: switch to map, center & select */
function goToBoothOnMap(booth){
  switchView("map");
  setTimeout(()=>{
    const cell=document.querySelector('.cell[data-booth="'+CSS.escape(booth)+'"]');
    if(!cell){ return; }
    document.querySelectorAll(".cell.sel").forEach(c=>c.classList.remove("sel"));
    cell.classList.add("sel");
    selectedBooth=booth;
    // center on cell
    const sw=stage.clientWidth, sh=stage.clientHeight;
    scale=Math.min(2.2, Math.max(baseScale*1.6, 1.6));
    const cx=cell.offsetLeft+cell.offsetWidth/2, cy=cell.offsetTop+cell.offsetHeight/2;
    tx=sw/2-cx*scale; ty=sh/2.6-cy*scale;
    clamp(); applyTransform();
    showHint(booth+" 위치");
    // 모달은 열지 않는다 — 색상·줌으로만 강조 (지도 검색 결과와 동일)
  },80);
}
const mapHint=document.getElementById("mapHint");
let hintT;
function showHint(t){ mapHint.textContent=t; mapHint.classList.add("show"); clearTimeout(hintT); hintT=setTimeout(()=>mapHint.classList.remove("show"),1800); }

/* ============ bottom sheet ============ */
const sheet=document.getElementById("sheet"),sheetBg=document.getElementById("sheetBg");
/* ============ zone mini-map (shown in map-context modal) ============ */
function zoneTileLabel(c){
  if(c==="B7extra") return "B700";
  if(byBooth[c]){ const m={"B400":"책마을","B701":"카페","B702":"라운지","B703":"주제전시","B704":"책마당"}; return m[c]||c; }
  return blockLabel(c);
}
function zoneMapHtml(booth){
  const isB=booth[0]==="B";
  const rows=isB?[...HALL_B_TOP,HALL_B_BOTTOM]:HALL_A;
  const hallName=isB?"Hall B1":"Hall A";
  let myCode=null;
  rows.forEach(r=>r.forEach(c=>{ if(boothsInBlock(c).indexOf(booth)>=0) myCode=c; }));
  let grid="";
  rows.forEach(r=>{
    grid+=`<div class="zrow">`+r.map(c=>{
      const me=c===myCode;
      return `<div class="ztile${me?" me":""}">${escapeHtml(zoneTileLabel(c))}</div>`;
    }).join("")+`</div>`;
  });
  const cap=isB
    ? `<div class="zcap">우측 <span class="arr">▶</span> B1홀 출입구</div>`
    : `<div class="zcap">하단 <span class="arr">▼</span> 출구 A200·A300 &nbsp;|&nbsp; 입구 A500·A600 <span class="arr">▲</span></div>`;
  // 이 구역의 부스 — 실제 배치(좌표 추출) 반영, 미추출 블록은 번호순
  const zb=myCode?boothsInBlock(myCode):[booth];
  let strip="";
  if(zb.length>1){
    const gridDef=(typeof BLOCK_GRID!=="undefined")?BLOCK_GRID[myCode]:null;
    if(gridDef){
      let rows=gridDef.map(r=>r.slice());
      const placed=new Set([].concat(...gridDef).filter(Boolean));
      const missing=zb.filter(b=>!placed.has(b));
      if(missing.length) rows.push(missing);
      const ncol=Math.max(1,...rows.map(r=>r.length));
      let cells="";
      rows.forEach(r=>{
        for(let i=0;i<ncol;i++){
          const b=r[i];
          cells+= b?`<button class="zb${b===booth?" sel":""}" data-zb="${b}">${b}</button>`:`<span class="zb-empty"></span>`;
        }
      });
      strip=`<div class="zstrip-hd">이 구역의 부스 · ${zb.length} <span class="zhint">실제 배치</span></div>`
        +`<div class="zgrid" style="grid-template-columns:repeat(${ncol},minmax(0,1fr))">${cells}</div>`;
    } else {
      strip=`<div class="zstrip-hd">이 구역의 부스 · ${zb.length}</div><div class="zstrip">`
        +zb.map(b=>`<button class="zb${b===booth?" sel":""}" data-zb="${b}">${b}</button>`).join("")
        +`</div>`;
    }
  }
  return `<div class="zone">
    <div class="zhd">구역 위치 ZONE <b>${escapeHtml(blockLabel(myCode||booth))} · ${hallName}</b></div>
    <div class="zmap">${grid}</div>${cap}${strip}
  </div><div class="zone-div"></div>`;
}

function openSheet(booth){
  const list=(byBooth[booth]||[]).slice().sort((a,b)=>a.no-b.no);
  if(!list.length) return;
  selectedBooth=booth;
  document.querySelectorAll(".cell.sel").forEach(c=>c.classList.remove("sel"));
  const cell=document.querySelector('.cell[data-booth="'+CSS.escape(booth)+'"]');
  if(cell) cell.classList.add("sel");
  document.getElementById("sheetCode").textContent=booth.indexOf("Ticket")===0?"INFO":booth;
  const lead=list[0];
  const cat=catOf(lead);
  const catName={vil:"책마을 · Book Village",cafe:"카페",ex:"전시/라운지",lec:"강연·홀"}[cat];
  document.getElementById("sheetTitle").textContent= list.length>1?`참가사 ${list.length}곳`:(lead.name||booth);
  document.getElementById("sheetSub").textContent= catName || (list.length>1?byBooth[booth][0].country:`${lead.country} · ${lead.en||""}`);
  let body="";
  body+=zoneMapHtml(booth);
  list.forEach(e=>{
    const fav=isFav(e.no);
    const intl=isIntl(e)?`<span class="flag">${flagOf(e)}</span> `:"";
    const en=(e.en&&e.en!==e.name)?`<div class="en">${escapeHtml(e.en)}</div>`:(e.en&&!e.ko?`<div class="en">${e.country}</div>`:"");
    const orig=e.ob&&e.ob!==e.booth?`<div class="en" style="color:var(--info)">원래 부스 ${e.ob}</div>`:"";
    body+=`<div class="srow">
      <div class="info"><div class="nm">${intl}${escapeHtml(e.name||e.en)}</div>${en}${orig}</div>
      <button class="star-btn ${fav?"on":""}" data-fav="${e.no}">${fav?"★":"☆"}</button>
    </div>`;
  });
  document.getElementById("sheetBody").innerHTML=body;
  // 목록에서 열면 '지도에서 보기' 노출, 지도에서 열면 생략
  sheet.classList.toggle("from-map", view==="map");
  sheetBg.classList.add("show"); sheet.classList.add("show");
}
function closeSheet(){ sheet.classList.remove("show"); sheetBg.classList.remove("show");
  document.querySelectorAll(".cell.sel").forEach(c=>c.classList.remove("sel")); selectedBooth=null; }
sheetBg.onclick=closeSheet;
document.getElementById("sheetClose").onclick=closeSheet;
// '지도에서 보기' — 지도 검색결과와 동일하게 해당 부스로 이동·강조
document.getElementById("sheetLocate").onclick=()=>{
  const booth=selectedBooth;
  if(!booth) return;
  closeSheet();
  goToBoothOnMap(booth);
};
document.getElementById("sheetBody").addEventListener("click",e=>{
  const zb=e.target.closest("[data-zb]");
  if(zb){ openSheet(zb.dataset.zb); return; }
  const fb=e.target.closest("[data-fav]"); if(!fb) return;
  const no=+fb.dataset.fav; toggleFav(no);
  fb.classList.toggle("on"); fb.textContent=isFav(no)?"★":"☆";
  renderChips(); if(view==="list") renderList(); paintCells();
});

/* ============ view switching ============ */
function switchView(v){
  view=v;
  document.getElementById("seg").classList.toggle("map",v==="map");
  document.getElementById("segList").classList.toggle("on",v==="list");
  document.getElementById("segMap").classList.toggle("on",v==="map");
  const listScroll=document.getElementById("listScroll");
  const mapView=document.getElementById("mapView");
  chipsEl.style.display=v==="list"?"flex":"none";
  countSum.style.display=v==="list"?"block":"none";
  document.getElementById("searchInput").placeholder=v==="map"?"부스·출판사 검색 후 지도에서 찾기":"출판사 · 부스번호 · 국가 검색";
  if(v==="map"){
    listScroll.classList.add("hide"); mapView.classList.add("show");
    if(!mapCanvas.innerHTML){ buildMap(); }
    requestAnimationFrame(()=>{ fitMap(); paintCells(); applyMapSearch(); });
  } else {
    listScroll.classList.remove("hide"); mapView.classList.remove("show");
    renderList();
  }
}
document.getElementById("segList").onclick=()=>switchView("list");
document.getElementById("segMap").onclick=()=>switchView("map");

/* ============ search ============ */
const searchInput=document.getElementById("searchInput");
const searchBox=document.getElementById("searchBox");
let composing=false, searchTimer=null;
function runSearch(){
  query=searchInput.value.trim().toLowerCase();
  if(view==="list"){ renderList(); resetListScroll(); }
  else { applyMapSearch(); }
}
function scheduleSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch,70);
}
searchInput.addEventListener("compositionstart",()=>{ composing=true; });
searchInput.addEventListener("compositionend",()=>{ composing=false; runSearch(); });
searchInput.addEventListener("input",e=>{
  searchBox.classList.toggle("has",!!searchInput.value);
  // 한글 조합(IME) 중에는 리스트를 다시 그리지 않는다 — 조합 중 동기 DOM 갱신이
  // 마지막 글자 중복 입력을 유발하므로 compositionend 시점에만 갱신한다.
  if(composing || e.isComposing) return;
  scheduleSearch();
});
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&view==="map"&&!e.isComposing){
    runSearch();
    const hit=applyMapSearch();
    if(hit){ goToBoothOnMap(hit.dataset.booth); searchInput.blur(); }
  }
});
document.getElementById("searchClear").onclick=()=>{
  searchInput.value=""; query=""; searchBox.classList.remove("has");
  if(view==="list"){ renderList(); resetListScroll(); } else applyMapSearch();
  searchInput.focus();
};

/* legend collapse */
document.getElementById("legendHd").onclick=()=>{
  const lg=document.getElementById("legend"); lg.classList.toggle("collapsed");
  document.getElementById("legendTg").textContent=lg.classList.contains("collapsed")?"▸":"▾";
};

window.addEventListener("resize",()=>{ if(view==="map") fitMap(); });

/* ============ init ============ */
renderChips();
renderList();
</script>
